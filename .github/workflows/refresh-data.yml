name: Refresh spending data

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install openpyxl==3.1.5
      - run: npm ci
      - run: python scripts/refresh_data.py
      - run: npm test
      - run: npm run build
      - name: Publish validated snapshot to main
        run: |
          git add src/data/snapshot.json public/data
          if git diff --cached --quiet; then
            echo "No source data changed"
            exit 0
          fi
          git config user.name "polstat-data-bot"
          git config user.email "polstat-data-bot@users.noreply.github.com"
          git commit -m "data: refresh official spending snapshot"
          git push origin HEAD:main
